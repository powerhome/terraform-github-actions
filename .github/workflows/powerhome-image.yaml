name: Build the image this organisation runs

# The upstream release workflow publishes danielflook/terraform-github-actions,
# which cannot carry changes that are not merged upstream. This builds the same
# image from this branch and publishes it to our own registry, so the actions in
# powerhome/software can run it.
#
# Pin the digest this prints, not a tag.

on:
  push:
    branches:
      - powerhome
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    name: Build and publish
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Registry login
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Set up buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # The base image is upstream's, pinned by digest so a rebuild of this
      # branch produces the same thing until the pin is moved deliberately.
      #
      # FETCH_CHECKSUMS is what puts terraform's checksums in /var/terraform.
      # dflook's own job-level binary cache can only verify a cached terraform
      # against a checksum from that directory, so an image built today knows
      # about versions released since upstream last cut one.
      - name: Build and publish
        id: build
        run: |
          BASE_DIGEST=$(docker buildx imagetools inspect danielflook/terraform-github-actions-base:latest --format '{{json .}}' | jq -r '.manifest.digest')
          sed -i "s|FROM danielflook/terraform-github-actions-base:latest|FROM danielflook/terraform-github-actions-base@$BASE_DIGEST|" image/Dockerfile

          docker buildx build \
            --build-arg FETCH_CHECKSUMS=yes \
            --build-arg VERSION="0.0.0+powerhome.${GITHUB_SHA:0:7}" \
            --platform linux/amd64 \
            --tag "ghcr.io/powerhome/terraform-github-actions:${GITHUB_SHA}" \
            --annotation "index,manifest:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "index,manifest:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index,manifest:org.opencontainers.image.base.name=docker.io/danielflook/terraform-github-actions-base" \
            --annotation "index,manifest:base.manifest.digest=$BASE_DIGEST" \
            --push \
            --iidfile digest.txt \
            image

          echo "digest=$(<digest.txt)" >> "$GITHUB_OUTPUT"
          echo "base-digest=$BASE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Say what to pin
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BASE_DIGEST: ${{ steps.build.outputs.base-digest }}
        run: |
          {
            echo "Pin this in powerhome/software:"
            echo
            echo '```'
            echo "docker://ghcr.io/powerhome/terraform-github-actions@${DIGEST}"
            echo '```'
            echo
            echo "Built on upstream base \`${BASE_DIGEST}\`."
          } >> "$GITHUB_STEP_SUMMARY"
